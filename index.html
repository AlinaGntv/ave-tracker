<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тайм-трекер</title>
    <style>
        :root {
            --bg-color: #f6f5ef;
            --text-main: #111111;
            --text-muted: #999;
            --border-color: #e8e6de;
            --accent: #25785f;
            --accent-light: #eef6f1;
            --card-bg: #ffffff;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
            --radius: 12px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; margin: 0; }

        body {
            font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            line-height: 1.5;
        }

        .container { max-width: 820px; width: 100%; }

        /* ===== Шапка ===== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .header-title-block { display: flex; flex-direction: column; gap: 4px; }

        .current-date {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.02em;
        }

        h1 {
            font-size: 56px;
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 1;
        }

        .btn-pill {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 18px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-pill:hover {
            border-color: var(--text-main);
            color: var(--text-main);
        }

        /* ===== Таймер ===== */
        .timer-section {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            padding: 32px 36px;
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .timer-huge { display: flex; align-items: baseline; gap: 10px; }

        .timer-huge .time {
            font-size: 72px;
            font-weight: 700;
            letter-spacing: -3px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .timer-huge .task-label {
            font-size: 20px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .timer-label-top {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 16px;
        }

        .circle-btn {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: var(--bg-color);
            border: 6px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.25s;
            flex-shrink: 0;
        }

        .circle-btn:hover { border-color: var(--accent); color: var(--accent); }

        .circle-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-light);
        }

        /* ===== Инпут задачи ===== */
        .task-input-row {
            margin-bottom: 32px;
        }

        .task-input-row input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 14px 18px;
            font-size: 15px;
            outline: none;
            color: var(--text-main);
            transition: border-color 0.2s;
        }

        .task-input-row input:focus {
            border-color: var(--accent);
        }

        .task-input-row input::placeholder { color: #bbb; }

        /* ===== Статистика ===== */
        .stats-section-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-value {
            font-size: 26px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-main);
            line-height: 1.2;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* ===== Секции ===== */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
        }

        .badge {
            background-color: var(--accent-light);
            color: var(--accent);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 500;
        }

        /* ===== Форма ручного ввода ===== */
        .manual-form {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 24px;
            margin-bottom: 40px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input, .manual-form input {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            font-size: 14px;
            border-radius: var(--radius-sm);
            outline: none;
            color: var(--text-main);
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--accent); }
        input::placeholder { color: #bbb; }

        .flex-grow { flex: 1; }

        .btn-solid {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .btn-solid:hover { background-color: #1e614d; }

        /* ===== История ===== */
        .record-list {
            display: flex;
            flex-direction: column;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            font-size: 14px;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.15s;
        }

        .record-item:hover { background: rgba(0,0,0,0.015); }
        .record-item:last-child { border-bottom: none; }

        .record-task {
            font-weight: 600;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .record-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
            margin-left: 16px;
        }

        .record-duration {
            font-variant-numeric: tabular-nums;
            font-weight: 500;
            color: var(--accent);
        }

        .record-date {
            color: var(--text-muted);
            font-size: 13px;
        }

        .record-delete {
            background: none;
            border: none;
            cursor: pointer;
            color: #ccc;
            font-size: 18px;
            line-height: 1;
            padding: 4px;
            transition: color 0.15s;
        }

        .record-delete:hover { color: #e74c3c; }

        .empty-state {
            color: var(--text-muted);
            padding: 24px 0;
            font-size: 14px;
            text-align: center;
        }

        /* ===== Мобильная версия ===== */
        @media (max-width: 700px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }

            .timer-section { flex-direction: column; gap: 24px; text-align: center; }
            .timer-huge .time { font-size: 52px; }

            .manual-form { flex-direction: column; }
            .manual-form input { width: 100%; }

            .record-item { flex-direction: column; align-items: flex-start; gap: 6px; }
            .record-meta { margin-left: 0; }

            h1 { font-size: 44px; }
        }

        @media (max-width: 400px) {
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <div class="header-title-block">
                <div class="current-date" id="currentDateLabel">июль 2026 г.</div>
                <h1>Трекер</h1>
            </div>
            <button class="btn-pill" onclick="app.clearAll()">Сбросить всё</button>
        </header>

        <div class="timer-section">
            <div>
                <div class="timer-label-top">Сейчас</div>
                <div class="timer-huge">
                    <span class="time" id="activeTimer">00:00:00</span>
                    <span class="task-label" id="activeTaskLabel">нет задачи</span>
                </div>
            </div>
            <div class="circle-btn" id="startBtn" onclick="app.toggleTimer()">Старт</div>
        </div>

        <div class="task-input-row">
            <input type="text" id="taskName" placeholder="Название текущей задачи...">
        </div>

        <div class="stats-section-label">Статистика</div>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="statToday">0ч</div>
                <div class="stat-label">Сегодня</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statYesterday">0ч</div>
                <div class="stat-label">Вчера</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statWeek">0ч</div>
                <div class="stat-label">Эта неделя</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statLastWeek">0ч</div>
                <div class="stat-label">Прошлая неделя</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statMonth">0ч</div>
                <div class="stat-label">Месяц</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statYear">0ч</div>
                <div class="stat-label">Год</div>
            </div>
        </div>

        <div class="section-header">
            <div class="section-title">Добавить вручную</div>
            <div class="badge" id="totalRecordsBadge">0 записей</div>
        </div>
        <div class="manual-form">
            <input type="text" id="manualTaskName" class="flex-grow" placeholder="Название задачи">
            <input type="date" id="manualDate">
            <input type="number" id="manualHours" placeholder="Часы" min="0" max="24" style="width: 80px;">
            <input type="number" id="manualMinutes" placeholder="Минуты" min="0" max="59" style="width: 80px;">
            <button class="btn-solid" onclick="app.addManualEntry()">Добавить</button>
        </div>

        <div class="section-header">
            <div class="section-title" style="color: var(--text-muted); font-weight: normal;">Последние записи</div>
        </div>
        <div class="record-list" id="recentRecords">
        </div>
    </div>

    <script>
        class TimeTracker {
            constructor() {
                this.records = JSON.parse(localStorage.getItem('timeTrackerDataV2')) || [];
                this.activeTask = null;
                this.timerInterval = null;

                // Установка дат
                const now = new Date();
                document.getElementById('manualDate').valueAsDate = now;

                const monthNames = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август",
                    "сентябрь", "октябрь", "ноябрь", "декабрь"
                ];
                document.getElementById('currentDateLabel').innerText =
                    `${monthNames[now.getMonth()]} ${now.getFullYear()} г.`;

                this.init();
            }

            init() {
                this.updateUI();
            }

            save() {
                // Очищаем старые записи (старше 1 года)
                const oneYearAgo = Date.now() - (365 * 24 * 60 * 60 * 1000);
                this.records = this.records.filter(r => new Date(r.date).getTime() > oneYearAgo);

                localStorage.setItem('timeTrackerDataV2', JSON.stringify(this.records));
                this.updateUI();
            }

            toggleTimer() {
                const btn = document.getElementById('startBtn');
                const input = document.getElementById('taskName');
                const label = document.getElementById('activeTaskLabel');

                if (!this.activeTask) {
                    // Старт
                    const name = input.value.trim() || 'Без названия';
                    this.activeTask = {
                        id: Date.now(),
                        name: name,
                        startTime: Date.now()
                    };
                    input.disabled = true;
                    btn.innerText = 'Стоп';
                    btn.classList.add('active');
                    label.innerText = `/ ${name}`;

                    this.timerInterval = setInterval(() => {
                        const diff = Date.now() - this.activeTask.startTime;
                        document.getElementById('activeTimer').innerText = this.formatTime(diff);
                    }, 1000);
                } else {
                    // Стоп
                    clearInterval(this.timerInterval);
                    const endTime = Date.now();
                    const duration = endTime - this.activeTask.startTime;

                    this.records.push({
                        id: this.activeTask.id,
                        name: this.activeTask.name,
                        duration: duration,
                        date: new Date().toISOString()
                    });

                    this.activeTask = null;
                    input.disabled = false;
                    input.value = '';
                    btn.innerText = 'Старт';
                    btn.classList.remove('active');
                    document.getElementById('activeTimer').innerText = '00:00:00';
                    label.innerText = '/ нет задачи';

                    this.save();
                }
            }

            addManualEntry() {
                const name = document.getElementById('manualTaskName').value.trim() || 'Без названия';
                const dateVal = document.getElementById('manualDate').value;
                const hours = parseInt(document.getElementById('manualHours').value) || 0;
                const minutes = parseInt(document.getElementById('manualMinutes').value) || 0;

                if (hours === 0 && minutes === 0) {
                    alert('Укажите потраченное время!');
                    return;
                }

                const durationMs = (hours * 60 * 60 * 1000) + (minutes * 60 * 1000);

                const recordDate = new Date(dateVal);
                recordDate.setHours(12, 0, 0, 0);

                this.records.push({
                    id: Date.now(),
                    name: name,
                    duration: durationMs,
                    date: recordDate.toISOString()
                });

                document.getElementById('manualTaskName').value = '';
                document.getElementById('manualHours').value = '';
                document.getElementById('manualMinutes').value = '';

                this.save();
            }

            clearAll() {
                if (confirm('Удалить всю историю? Это действие нельзя отменить.')) {
                    this.records = [];
                    localStorage.removeItem('timeTrackerDataV2');
                    this.updateUI();
                }
            }

            deleteRecord(id) {
                if (confirm('Удалить эту запись?')) {
                    this.records = this.records.filter(r => r.id !== id);
                    this.save();
                }
            }

            updateUI() {
                this.calculateStats();
                this.renderRecent();
                document.getElementById('totalRecordsBadge').innerText = `${this.records.length} записей`;
            }

            calculateStats() {
                const now = new Date();
                const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
                const startOfYesterday = startOfDay - 24 * 60 * 60 * 1000;
                const startOfWeek = startOfDay - (now.getDay() === 0 ? 6 : now.getDay() - 1) * 24 * 60 * 60 * 1000;
                const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
                const startOfYear = new Date(now.getFullYear(), 0, 1).getTime();

                const startOfLastWeek = startOfWeek - 7 * 24 * 60 * 60 * 1000;

                let msToday = 0,
                    msYesterday = 0,
                    msWeek = 0,
                    msLastWeek = 0,
                    msMonth = 0,
                    msYear = 0;

                this.records.forEach(record => {
                    const recordTime = new Date(record.date).getTime();
                    if (recordTime >= startOfDay) msToday += record.duration;
                    if (recordTime >= startOfYesterday && recordTime < startOfDay) msYesterday += record.duration;
                    if (recordTime >= startOfWeek) msWeek += record.duration;
                    if (recordTime >= startOfLastWeek && recordTime < startOfWeek) msLastWeek += record.duration;
                    if (recordTime >= startOfMonth) msMonth += record.duration;
                    if (recordTime >= startOfYear) msYear += record.duration;
                });

                document.getElementById('statToday').innerText = this.formatShortDuration(msToday);
                document.getElementById('statYesterday').innerText = this.formatShortDuration(msYesterday);
                document.getElementById('statWeek').innerText = this.formatShortDuration(msWeek);
                document.getElementById('statLastWeek').innerText = this.formatShortDuration(msLastWeek);
                document.getElementById('statMonth').innerText = this.formatShortDuration(msMonth);
                document.getElementById('statYear').innerText = this.formatShortDuration(msYear);
            }

            renderRecent() {
                const container = document.getElementById('recentRecords');
                container.innerHTML = '';

                if (this.records.length === 0) {
                    container.innerHTML =
                        '<div class="empty-state">Пока нет записей</div>';
                    return;
                }

                const recent = [...this.records].sort((a, b) => b.id - a.id).slice(0, 15);

                recent.forEach(record => {
                    const div = document.createElement('div');
                    div.className = 'record-item';
                    const d = new Date(record.date);
                    const dateStr = d.toLocaleDateString('ru-RU', {
                        day: '2-digit',
                        month: '2-digit',
                        year: '2-digit'
                    });

                    div.innerHTML = `
                        <div class="record-task">${record.name}</div>
                        <div class="record-meta">
                            <span class="record-duration">${this.formatDurationStr(record.duration)}</span>
                            <span class="record-date">${dateStr}</span>
                            <button class="record-delete" onclick="app.deleteRecord(${record.id})">×</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            }

            formatTime(ms) {
                const totalSeconds = Math.floor(ms / 1000);
                const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
                const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
                const seconds = String(totalSeconds % 60).padStart(2, '0');
                return `${hours}:${minutes}:${seconds}`;
            }

            formatDurationStr(ms) {
                const totalMinutes = Math.floor(ms / (1000 * 60));
                const hours = Math.floor(totalMinutes / 60);
                const mins = totalMinutes % 60;
                if (hours > 0) return `${hours}ч ${mins}м`;
                return `${mins}м`;
            }

            formatShortDuration(ms) {
                if (ms === 0) return '0ч';
                const totalMinutes = Math.floor(ms / (1000 * 60));
                const hours = Math.floor(totalMinutes / 60);
                const mins = totalMinutes % 60;
                if (hours > 0 && mins > 0) return `${hours}ч ${mins}м`;
                if (hours > 0) return `${hours}ч`;
                return `${mins}м`;
            }
        }

        const app = new TimeTracker();
    </script>
</body>

</html>
